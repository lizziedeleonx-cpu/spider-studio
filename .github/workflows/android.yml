name: Build Spider Studio Design APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::Android SDK is not available on this runner."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36-ext1" \
            "build-tools;36.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_PATH="$(find . -type f -name 'spider-studio-design.zip' -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Project ZIP not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

          WRAPPER="$(find extracted -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle wrapper not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts not found."
            exit 1
          fi

          chmod +x "$WRAPPER"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Studio-Design-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
