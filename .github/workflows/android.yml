name: Build Spider Studio Design APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate and extract project
        shell: bash
        run: |
          set -e

          ZIP_PATH="$(find . -type f -name 'spider-studio-design.zip' -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::The project ZIP was not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

          WRAPPER="$(find extracted -type f -name 'gradlew' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle wrapper (gradlew) was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::Gradle settings file was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module was not found."
            exit 1
          fi

          chmod +x "$WRAPPER"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project located at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Studio-Design-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
